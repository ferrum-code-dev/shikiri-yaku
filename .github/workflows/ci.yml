name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # An hour after Shikiru's daily release at 00:00 UTC
    - cron: "0 1 * * *"

permissions:
  contents: read

concurrency:
  # A scheduled run never cancels, or is cancelled by, a run for a push or a pull request
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.5"
          python-version: "3.14"
          enable-cache: false

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run quality gate
        run: uv run --locked poe check

  contract:
    name: Shikiru contract
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.5"
          python-version: "3.14"
          enable-cache: false

      - name: Sync locked environment
        run: uv sync --locked

      - name: Find the latest Shikiru release
        id: shikiru
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo ferrum-code-dev/shikiru --json tagName --jq .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Checking the contract against Shikiru $tag." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ferrum-code-dev/shikiru
          ref: ${{ steps.shikiru.outputs.tag }}
          path: shikiru-src
          persist-credentials: false

      - name: Install tmux
        # The check starts the engine in tmux. Shikiru needs tmux 3.5 or newer, which the Ubuntu
        # apt archive does not offer, so the job runs on macOS and takes tmux from Homebrew.
        run: brew install tmux

      - name: Check the tmux version
        run: |
          version=$(tmux -V)
          echo "$version"
          if [[ "$version" =~ ([0-9]+)\.([0-9]+) ]] &&
            (( BASH_REMATCH[1] > 3 || (BASH_REMATCH[1] == 3 && BASH_REMATCH[2] >= 5) )); then
            exit 0
          fi
          echo "::error::$version is older than 3.5, which Shikiru requires."
          exit 1

      - name: Sync Shikiru's locked environment
        run: uv sync --locked --project shikiru-src

      - name: Run the contract check
        run: uv run python .github/scripts/contract_check.py --shikiru-checkout shikiru-src
