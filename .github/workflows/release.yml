---
name: Release

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release as <major>.<minor>.<patch>; empty proposes the next one"
        required: false
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Choose the commit and the version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse to release from a branch other than main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "The Release workflow runs on main, not on $REF." >&2
            exit 1
          fi

      - name: Find the newest commit of main that passed CI
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha=$(gh run list --workflow ci.yml --branch main --event push --status success --limit 1 \
            --json headSha --jq '.[0].headSha // empty')
          if [ -z "$sha" ]; then
            echo "No successful CI run on a push to main was found." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "The commit $sha that passed CI is not on origin/main." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out the commit that passed CI
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: git checkout --detach "$SHA"

      - name: Propose the next version with git-cliff
        id: proposal
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2
          args: --bumped-version

      - name: Choose the version
        id: version
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          REQUESTED: ${{ inputs.version }}
          PROPOSED: ${{ steps.proposal.outputs.content }}
        run: |
          release=true
          # Not git describe: from an older commit it names an older tag and hides the check below.
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -n "$last" ] && ! git merge-base --is-ancestor "$last" "$SHA"; then
            release=false
            echo "The commit $SHA that passed CI is not after $last; nothing to release." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$REQUESTED" ]; then
            version="$REQUESTED"
          else
            # With nothing to release, git-cliff prints a note and then the last tag.
            proposed=$(printf '%s\n' "$PROPOSED" | tail -n 1 | tr -d '[:space:]')
            version="${proposed#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "git-cliff proposed '$proposed', which is not a version." >&2
              exit 1
            fi
            if [ "$release" = true ] && [ "$proposed" = "$last" ]; then
              release=false
              echo "Nothing to release since $last." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [ "$release" = true ]; then
            echo "Release v$version from commit $SHA." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build the wheel and the sdist
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.5"
          python-version: "3.14"
          enable-cache: false

      - name: Build the wheel and the sdist with the release version
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.prepare.outputs.version }}
        run: uv build

      - name: Check that the wheel is named for the release version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          wheel="dist/shikiri_yaku-${VERSION}-py3-none-any.whl"
          if [ ! -f "$wheel" ]; then
            echo "$wheel is missing; the build did not use the release version." >&2
            exit 1
          fi

      - name: Check that the installed wheel reports the release version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          wheel="dist/shikiri_yaku-${VERSION}-py3-none-any.whl"
          output=$(uv run --isolated --no-project --with "$wheel" shikiri-yaku --version)
          echo "$output"
          if ! grep -qF "$VERSION" <<< "$output"; then
            echo "The installed wheel did not report version $VERSION." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  github:
    name: Publish the GitHub release
    needs: [prepare, pypi]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Write the release notes from the commits
        id: notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2
          args: --unreleased --tag v${{ needs.prepare.outputs.version }} --strip all

      - name: Save the release notes
        env:
          NOTES: ${{ steps.notes.outputs.content }}
        run: printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.md"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          gh release create "v$VERSION" --target "$SHA" --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --latest
